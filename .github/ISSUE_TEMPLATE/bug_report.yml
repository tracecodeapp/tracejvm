name: Bug report
description: Report a reproducible TraceJVM defect
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities here; use private vulnerability reporting.
  - type: input
    id: version
    attributes:
      label: TraceJVM version and runtime release ID
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, operating system, and versions
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the smallest source, classpath, or repository that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and logs
    validations:
      required: true
